version: '3.8'

services:
  app:
    # 生产环境使用构建好的镜像（替换为你自己的镜像地址）
    image: ghcr.io/dannis-arm/dannis-authing:latest
    # 本地开发测试时，注释上面的image行，放开下面的build行
    # build: .
    container_name: dannis-authing
    # restart: always
    ports:
      # 只监听本地回环地址，外网只能通过Caddy访问，更安全
      - "127.0.0.1:3000:3000"
    environment:
      # BWS秘钥配置，通过环境变量传入，不要硬编码
      - BWS_ACCESS_TOKEN=${BWS_ACCESS_TOKEN}
      - BWS_PROJECT_ID=${BWS_PROJECT_ID}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 60s
      timeout: 5s
      retries: 2
      start_period: 20s

  caddy:
    image: caddy:alpine
    container_name: caddy-proxy
    # restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./logs/caddy:/var/log/caddy
    depends_on:
      - app
    environment:
      - TZ=Asia/Shanghai
    # 内存限制适配512MB服务器，最多占用64MB
    mem_limit: 64m
    mem_reservation: 32m
    # 关闭健康检查节省资源
    healthcheck:
      disable: true

volumes:
  caddy_data:
  caddy_config:

# 使用说明：
# 1. 本地构建测试：podman-compose up --build
# 2. 生产启动：BWS_ACCESS_TOKEN=你的token BWS_PROJECT_ID=你的项目ID podman-compose up -d
# 3. 查看日志：podman-compose logs -f app
# 4. 停止服务：podman-compose down